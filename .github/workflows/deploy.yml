name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          path: content
          persist-credentials: false
          # Full history: each page's "Updated …" date is its last commit.
          fetch-depth: 0

      # Specly (private) is the engine that turns this content into the site.
      - name: Checkout Specly
        uses: actions/checkout@v4
        with:
          repository: pratik-mahalle/specly
          ssh-key: ${{ secrets.TESSA_DEPLOY_KEY }}
          path: specly
          # Don't leave the key on disk while npm packages install and run.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: specly/package-lock.json

      - name: Install Specly
        working-directory: specly
        run: npm ci

      - name: Build site
        working-directory: specly
        env:
          DOCS_DIR: ${{ github.workspace }}/content
        run: npm run build

      - name: Check built site (pages, links, theme)
        working-directory: specly
        env:
          DOCS_DIR: ${{ github.workspace }}/content
        run: npm run test:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: specly/dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
